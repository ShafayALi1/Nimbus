# Jenkins Configuration as Code: the whole Jenkins setup lives in Git, nothing is clicked in the UI.
# Values like ${GITHUB_USER} come from ci/jenkins/.env
jenkins:
  systemMessage: "Nimbus CI (local). Configured by casc.yaml; UI changes are lost on restart."
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: github
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"
              description: GitHub token (clone nimbus-app, push to nimbus-platform)

unclassified:
  location:
    url: http://localhost:8090/

jobs:
  - script: >
      multibranchPipelineJob('nimbus-app') {
        displayName('nimbus-app')
        branchSources {
          git {
            id('nimbus-app')
            remote('https://github.com/${GITHUB_USER}/nimbus-app.git')
            credentialsId('github')
          }
        }
        triggers { periodicFolderTrigger { interval('2m') } }
        orphanedItemStrategy { discardOldItems { numToKeep(5) } }
      }
