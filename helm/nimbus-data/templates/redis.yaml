apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: nimbus }
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: nimbus }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999           # the 'redis' user in the alpine image
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: [--appendonly, "yes"]   # queued jobs survive a restart
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 10
            failureThreshold: 6
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext: {{- include "data.securityContext" . | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .Values.redis.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: { app.kubernetes.io/name: redis }
spec:
  selector: { app.kubernetes.io/name: redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: redis }
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "data.allowClients" . | nindent 8 }}
      ports: [{ port: 6379 }]
