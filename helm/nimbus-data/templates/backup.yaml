{{- if .Values.backup.enabled }}
# Daily pg_dump to its own volume, keeping the last {{ .Values.backup.keepDays }} days.
# Restore drill: docs/runbooks/restore-database.md
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-backups
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: {{ .Values.backup.storage }} } }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: { app.kubernetes.io/name: db-backup, app.kubernetes.io/part-of: nimbus }
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: backup
              image: {{ .Values.postgres.image }}
              command:
                - sh
                - -c
                - |
                  set -eu
                  file=/backups/nimbus-$(date +%Y%m%d-%H%M%S).dump
                  pg_dump -h postgres -U nimbus -Fc -f "$file" nimbus
                  find /backups -name '*.dump' -mtime +{{ .Values.backup.keepDays }} -delete
                  ls -lh /backups
              env:
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: {{ .Values.passwordSecret }}, key: password } }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
              securityContext: {{- include "data.securityContext" . | nindent 16 }}
              volumeMounts:
                - { name: backups, mountPath: /backups }
          volumes:
            - name: backups
              persistentVolumeClaim: { claimName: db-backups }
{{- end }}
