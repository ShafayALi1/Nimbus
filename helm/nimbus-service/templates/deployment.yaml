{{- if not .Values.rollout.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nimbus.name" . }}
  labels: {{- include "nimbus.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # new pod must be ready before an old one goes
  selector:
    matchLabels: {{- include "nimbus.selectorLabels" . | nindent 6 }}
  template:
    {{- include "nimbus.podTemplate" . | nindent 4 }}
{{- end }}
