# web in dev. CI changes only the "tag" line (see nimbus-app/Jenkinsfile).
name: web
image:
  repository: localhost:5001/nimbus/web
  tag: "0.1.0"
env:
  - name: ORDERS_API_URL
    value: http://orders-api:8000
ingress:
  enabled: true
  host: nimbus.localtest.me
networkPolicy:
  allowIngressController: true
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
