# Every push to nimbus-platform is checked before Argo CD ever sees it.
name: validate

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -recursive -check terraform
      - name: validate every root module
        run: |
          for d in terraform/bootstrap terraform/envs/local terraform/envs/aws-dev; do
            terraform -chdir=$d init -backend=false -input=false >/dev/null && terraform -chdir=$d validate
          done
      - uses: terraform-linters/setup-tflint@v4
      - run: for m in terraform/modules/*; do tflint --chdir=$m; done

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r ansible/requirements.txt
      - name: lint (a dummy key stands in for the lab key)
        working-directory: ansible
        run: |
          mkdir -p lab/.ssh && ssh-keygen -q -t ed25519 -N "" -f lab/.ssh/id_ed25519
          ansible-playbook site.yml --syntax-check
          ansible-lint site.yml roles

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: install kubeconform
        run: curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
      - name: lint and validate every chart for every environment
        run: |
          set -e
          CRDS='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          helm lint helm/nimbus-service helm/nimbus-data gitops/root
          for env in dev prod; do
            for svc in web orders-api worker; do
              helm template $svc helm/nimbus-service -n nimbus-$env -f gitops/envs/$env/$svc.yaml > /tmp/$env-$svc.yaml
            done
            helm template data helm/nimbus-data -n nimbus-$env -f gitops/envs/$env/data.yaml > /tmp/$env-data.yaml
          done
          helm template root gitops/root > /tmp/root.yaml
          kubeconform -strict -summary -schema-location default -schema-location "$CRDS" \
            /tmp/*.yaml platform/logging/loki platform/security/policies platform/monitoring/extras

  prometheus-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check alert rules with promtool
        run: |
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v3.1.0/prometheus-3.1.0.linux-amd64.tar.gz \
            | tar xz --strip-components=1 prometheus-3.1.0.linux-amd64/promtool
          yq '{"groups": .spec.groups}' platform/monitoring/extras/nimbus-rules.yaml > /tmp/rules.yml
          ./promtool check rules /tmp/rules.yml
