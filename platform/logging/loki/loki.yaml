# Loki in single-binary mode: one pod, logs on a local volume, kept 3 days. Enough for a laptop.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      log_level: warn
    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 72h
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
    analytics:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  labels: { app.kubernetes.io/name: loki }
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: loki }
  template:
    metadata:
      labels: { app.kubernetes.io/name: loki }
      annotations:
        config-version: "1"     # bump to restart Loki after changing the ConfigMap
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: loki
          image: grafana/loki:3.7.10
          args: [-config.file=/etc/loki/loki.yaml]
          ports: [{ name: http, containerPort: 3100 }]
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /loki }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: loki }
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels: { app.kubernetes.io/name: loki }
spec:
  selector: { app.kubernetes.io/name: loki }
  ports: [{ name: http, port: 3100, targetPort: http }]
