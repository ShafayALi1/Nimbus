apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/description: Every container declares CPU request and memory limit, so one pod can't starve the node.
spec:
  background: true
  rules:
    - name: requests-and-limits
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["nimbus-*"]
      validate:
        failureAction: Enforce
        message: "Set resources.requests.cpu and resources.limits.memory on every container."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                  limits:
                    memory: "?*"
