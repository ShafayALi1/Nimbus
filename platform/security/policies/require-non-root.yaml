apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root
  annotations:
    policies.kyverno.io/description: Containers may not run as root. A break-out from a root container is a root break-out.
spec:
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["nimbus-*"]
      validate:
        failureAction: Enforce
        message: "Set securityContext.runAsNonRoot: true on the pod."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
