# Local Kubernetes: 1 control plane + 2 workers, all Docker containers on your laptop.
# Ingress: http://*.localtest.me:8088 (localtest.me always points to 127.0.0.1, so no hosts-file edits).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: nimbus
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - { containerPort: 80, hostPort: 8088, protocol: TCP }
      - { containerPort: 443, hostPort: 8448, protocol: TCP }
  - role: worker
  - role: worker
# Lets every node pull from the local registry (localhost:5001), see scripts/up.sh
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
