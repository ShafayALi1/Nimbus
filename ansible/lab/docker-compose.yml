# Two lab servers for Ansible. Start with:  sh lab/up.sh   (from the ansible folder)
x-node: &node
  build: .
  privileged: true            # systemd and Docker-inside need it. Lab only, never in production.
  cgroup: host
  tmpfs: [/run, /run/lock]
  volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]

services:
  node1:
    <<: *node
    hostname: node1
    ports: ["2221:22"]
  node2:
    <<: *node
    hostname: node2
    ports: ["2222:22"]
