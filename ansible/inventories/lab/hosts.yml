# Two lab "servers" (containers from lab/docker-compose.yml) reached over SSH, like real machines.
all:
  vars:
    ansible_user: ansible
    ansible_host: 127.0.0.1
    ansible_ssh_private_key_file: lab/.ssh/id_ed25519
  children:
    app_servers:
      hosts:
        node1: { ansible_port: 2221 }
        node2: { ansible_port: 2222 }
