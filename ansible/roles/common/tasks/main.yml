- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set the timezone
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ common_timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: Create the deploy user
  ansible.builtin.user:
    name: "{{ common_deploy_user }}"
    shell: /bin/bash
    groups: [sudo]
    append: true

- name: Create the deploy user's .ssh directory
  ansible.builtin.file:
    path: "/home/{{ common_deploy_user }}/.ssh"
    state: directory
    owner: "{{ common_deploy_user }}"
    group: "{{ common_deploy_user }}"
    mode: "0700"

- name: Install the deploy user's SSH key
  ansible.builtin.copy:
    content: "{{ common_deploy_ssh_pubkey }}\n"
    dest: "/home/{{ common_deploy_user }}/.ssh/authorized_keys"
    owner: "{{ common_deploy_user }}"
    group: "{{ common_deploy_user }}"
    mode: "0600"
  when: common_deploy_ssh_pubkey | length > 0

- name: Let the deploy user use sudo without a password (it has no password; SSH keys only)
  ansible.builtin.copy:
    content: "{{ common_deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/{{ common_deploy_user }}"
    mode: "0440"
    validate: visudo -cf %s

- name: Harden SSH (keys only, no root login)
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    mode: "0644"
  notify: Check and reload sshd
