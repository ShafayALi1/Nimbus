# Test the config before reloading: a broken sshd config would lock everyone out.
- name: Check and reload sshd
  ansible.builtin.command: sshd -t
  changed_when: false
  notify: Reload sshd

- name: Reload sshd
  ansible.builtin.service:
    name: ssh
    state: reloaded
  when: ansible_service_mgr == 'systemd'
